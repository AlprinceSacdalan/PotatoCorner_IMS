<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard</title>
<link rel="stylesheet" href="/PotatoCorner_IMS/css/style.css">
</head>
<body>

<div class="staff-topbar">
    <span class="brand">
      <img src="/PotatoCorner_IMS/assets/images/pc_logo.png" alt="Potato Corner logo">
      Potato Corner IMS
    </span>
    <nav>
        <a href="/PotatoCorner_IMS/html/staff_dashboard.html" class="active">Dashboard</a>
        <a href="/PotatoCorner_IMS/html/process_sale.html">Process Sale</a>
    </nav>
    <div class="user-area">
        <span id="welcomeMsg"></span>
        <button id="logoutBtn">Log out</button>
    </div>
</div>

<div class="page-content">
    <h1>Good day, <span id="firstName"></span></h1>

    <h2 class="dashboard-subheading">Today's sales</h2>
    <div class="dashboard-stats" id="salesStats"></div>

    <div class="dashboard-section">
        <h2>Stock levels</h2>
        <table id="stockTable">
            <thead>
                <tr><th>Item</th><th>Unit</th><th>Current stock</th><th>Threshold</th><th>Status</th></tr>
            </thead>
            <tbody id="stockBody"></tbody>
        </table>
    </div>

    <div class="dashboard-section" style="margin-top:20px;">
        <h2>Today's transactions</h2>
        <table id="transactionsTable">
            <thead>
                <tr><th>Transaction #</th><th>Date/Time</th><th>Cashier</th><th>Items</th><th>Total</th></tr>
            </thead>
            <tbody id="transactionsBody"></tbody>
        </table>
        <p id="noTransactionsMsg" class="form-label" style="display:none; margin-top:8px;">
            No transactions yet today.
        </p>
    </div>
</div>

<script src="/PotatoCorner_IMS/js/config.js"></script>
<script src="/PotatoCorner_IMS/js/auth-guard.js"></script>
<script src="/PotatoCorner_IMS/js/staff_dashboard.js"></script>
</body>
</html>
