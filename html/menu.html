<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu / BOM</title>
<link rel="stylesheet" href="/PotatoCorner_IMS/css/style.css">
</head>
<body>
<div class="app-layout">
    <div class="sidebar">
            <div class="brand"><img src="/PotatoCorner_IMS/assets/images/pc_logo.png" alt="Potato Corner Logo"><span>Potato Corner IMS</span></div>
            <nav>
            <a href="/PotatoCorner_IMS/html/dashboard.html">Dashboard</a>
            <a href="/PotatoCorner_IMS/html/inventory.html">Inventory</a>
            <a href="/PotatoCorner_IMS/html/menu.html" class="active">Menu / BOM</a>
            <a href="/PotatoCorner_IMS/html/reorder.html">Reorder List</a>
            <a href="/PotatoCorner_IMS/html/reports.html">Sales & Reports</a>
            <a href="/PotatoCorner_IMS/html/waste.html">Waste Log</a>
            <a href="/PotatoCorner_IMS/html/expiry.html">Expiry Alerts</a>
            <a href="/PotatoCorner_IMS/html/staff.html">Staff Accounts</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="topbar"><span id="welcomeMsg"></span><button id="logoutBtn">Log out</button></div>
        <div class="page-content">
    <h1>Menu / BOM</h1>

    <div class="menu-bom-layout">
        <div class="menu-list-panel">
            <div class="panel-header">
                <p class="form-label">Menu items</p>
                <button id="addMenuItemBtn">+ Add menu item</button>
            </div>
            <div id="menuItemList" class="menu-item-list"></div>
        </div>

        <div class="recipe-panel">
            <p class="form-label" id="recipeTitle">Select a menu item to view its recipe</p>
            <table id="recipeTable" style="display:none;">
                <thead>
                    <tr><th>Ingredient</th><th>Qty required</th><th>Actions</th></tr>
                </thead>
                <tbody id="recipeBody"></tbody>
            </table>

            <div id="addIngredientForm" class="form-row" style="display:none; margin-top:1rem;">
                <select id="ingredientSelect"></select>
                <input type="number" id="ingredientQty" placeholder="Quantity" step="0.01">
                <button id="addIngredientBtn">+ Add ingredient</button>
            </div>
            <p id="recipeMsg" class="error-text"></p>
        </div>
    </div>

  
    <div id="addMenuItemModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="menuItemModalTitle">Add menu item</h2>
            <div class="form-row" style="margin-top:1rem;">
                <input type="text" id="newItemName" placeholder="Item name">
                <input type="number" id="newItemPrice" placeholder="Price" step="0.01">
            </div>
            <p id="menuItemModalError" class="error-text"></p>
            <div class="modal-actions">
                <button id="cancelMenuItemBtn">Cancel</button>
                <button id="saveNewItemBtn">Save item</button>
            </div>
        </div>
    </div>
</div>
    </div>
</div>
<script src="/PotatoCorner_IMS/js/config.js"></script>
<script src="/PotatoCorner_IMS/js/auth-guard.js"></script>
<script src="/PotatoCorner_IMS/js/menu.js"></script>
</body>
</html>
