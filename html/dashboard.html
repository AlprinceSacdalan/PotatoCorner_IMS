<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manager Dashboard</title>
<link rel="stylesheet" href="/PotatoCorner_IMS/css/style.css">
</head>
<body>

<div class="app-layout">
    <div class="sidebar">
        <div class="brand">
            <img src="/PotatoCorner_IMS/assets/images/pc_logo.png" alt="Potato Corner Logo">
            <span>Potato Corner IMS</span>
        </div>
        <nav>
            <a href="/PotatoCorner_IMS/html/dashboard.html" class="active">Dashboard</a>
            <a href="/PotatoCorner_IMS/html/inventory.html">Inventory</a>
            <a href="/PotatoCorner_IMS/html/menu.html">Menu / BOM</a>
            <a href="/PotatoCorner_IMS/html/reorder.html">Reorder List</a>
            <a href="/PotatoCorner_IMS/html/reports.html">Sales & Reports</a>
            <a href="/PotatoCorner_IMS/html/waste.html">Waste Log</a>
            <a href="/PotatoCorner_IMS/html/expiry.html">Expiry Alerts</a>
            <a href="/PotatoCorner_IMS/html/staff.html">Staff Accounts</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="topbar">
            <span id="welcomeMsg"></span>
            <button id="logoutBtn">Log out</button>
        </div>
        <div class="page-content">
            <h1>Manager Dashboard</h1>

            <h2 class="dashboard-subheading">Today's sales</h2>
            <div class="dashboard-stats" id="salesStats"></div>

            <h2 class="dashboard-subheading">Inventory overview</h2>
            <div class="dashboard-stats" id="dashboardStats"></div>

            <div class="dashboard-section">
                <h2>Stock alerts</h2>
                <table id="lowStockTable">
                    <thead>
                        <tr><th>Material</th><th>Current stock</th><th>Threshold</th><th>Status</th></tr>
                    </thead>
                    <tbody id="lowStockBody"></tbody>
                </table>
                <p id="noLowStockMsg" class="form-label" style="display:none; margin-top:8px;">
                    All materials are sufficiently stocked.
                </p>
            </div>
        </div>
    </div>
</div>

<script src="/PotatoCorner_IMS/js/config.js"></script>
<script src="/PotatoCorner_IMS/js/auth-guard.js"></script>
<script src="/PotatoCorner_IMS/js/dashboard.js"></script>
</body>
</html>
