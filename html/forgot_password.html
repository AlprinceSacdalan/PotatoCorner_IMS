
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/auth.css">
  <title>Forgot Password - Potato Corner IMS</title>
</head>
<body>
  <main>
    <h1>Forgot Password</h1>
    <p>Enter the email address associated with your manager account.</p>

    <form id="forgotForm">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
      >
      <button type="submit" id="submitBtn">Send Reset Link</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">Back to Login</a></p>
  </main>

  <script>
    const form = document.getElementById('forgotForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      button.disabled = true;

      try {
        const response = await fetch('../api/auth/forgot_password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim()
          })
        });

        const result = await response.json();
        message.textContent = result.message ||
          'Unable to process your request.';
      } catch (error) {
        message.textContent =
          'Unable to connect to the server. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
