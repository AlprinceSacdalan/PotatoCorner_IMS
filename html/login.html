<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potato Corner Inventory System - Login</title>
<link rel="stylesheet" href="/PotatoCorner_IMS/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-box">
        <img src="/PotatoCorner_IMS/assets/images/pc_logo.png" alt="Potato Corner" class="login-logo">
        <h2>Potato Corner Inventory System</h2>
        <form id="loginForm" autocomplete="off">
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="off" required>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>
            <p id="errorMsg" class="error-text"></p>
            <button type="submit">Log in</button>
        </form>
    </div>
</div>

<script src="/PotatoCorner_IMS/js/config.js"></script>
<script src="/PotatoCorner_IMS/js/login.js"></script>
</body>
</html>
