<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/auth.css">
  <title>Reset Password - Potato Corner IMS</title>
</head>
<body>
  <main>
    <h1>Reset Your Password</h1>
    <p>Enter your new password below.</p>

    <form id="resetForm">
     
<label for="newPassword">New password</label>
<div class="password-wrapper">
  <input
    type="password"
    id="newPassword"
    autocomplete="new-password"
    minlength="8"
    required
  >
  <button
    type="button"
    class="toggle-password"
    data-target="newPassword"
    aria-label="Show new password"
    aria-pressed="false"
  >
    👁
  </button>
</div>

<label for="confirmPassword">Confirm new password</label>
<div class="password-wrapper">
  <input
    type="password"
    id="confirmPassword"
    autocomplete="new-password"
    minlength="8"
    required
  >
  <button
    type="button"
    class="toggle-password"
    data-target="confirmPassword"
    aria-label="Show confirm password"
    aria-pressed="false"
  >
    👁
  </button>
</div>
      <button type="submit" id="submitBtn">Reset Password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">Back to Login</a></p>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitBtn');

    const token = new URLSearchParams(window.location.search).get('token');
    
async function verifyResetToken() {
  if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
    form.hidden = true;
    message.textContent =
      'This reset link is invalid. Please request a new one.';
    return;
  }

  button.disabled = true;

  try {
    const response = await fetch('../api/auth/verify_reset_token.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      form.hidden = true;
      message.textContent =
        result.message ||
        'This reset link is invalid or has expired. Please request a new one.';
      return;
    }

    form.hidden = false;
  } catch (error) {
    form.hidden = true;
    message.textContent =
      'Unable to verify this link. Please refresh the page or try again.';
  } finally {
    button.disabled = false;
  }
}

verifyResetToken();


    if (!token || !/^[a-f0-9]{64}$/i.test(token)) {
      message.textContent =
        'This reset link is invalid. Please request a new one.';
      button.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const password = document.getElementById('newPassword').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        message.textContent =
          'Your password must be at least 8 characters long.';
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = 'The passwords do not match.';
        return;
      }

      button.disabled = true;

      try {
        const response = await fetch('../api/auth/reset_password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: password })
        });

        const result = await response.json();
        message.textContent = result.message ||
          'Unable to reset your password.';

        if (response.ok && result.success) {
          form.reset();
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );
        }
      } catch (error) {
        message.textContent =
          'Unable to connect to the server. Please try again.';
      } finally {
        button.disabled = false;
      }
    });

    
document.querySelectorAll('.toggle-password').forEach((button) => {
    button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.target);
        const showPassword = input.type === 'password';

        input.type = showPassword ? 'text' : 'password';

        button.setAttribute(
            'aria-label',
            showPassword ? 'Hide password' : 'Show password'
        );

        button.setAttribute(
            'aria-pressed',
            String(showPassword)
        );

        button.textContent = showPassword ? '👁' : '👁';
    });
});

  </script>
</body>
</html>
